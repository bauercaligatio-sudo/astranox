<!doctype html>
<html lang="de" data-faction="nyxaren">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Astranox</title>
  <meta name="description" content="Astranox — ein düsteres Retro-Science-Fantasy Pen-&-Paper-Setting." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .intro {
      min-height:100svh; min-height:100vh; display:grid; place-items:center; position:relative;
      overflow:hidden; text-align:center; padding:24px; cursor:pointer;
      background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), var(--bg);
    }

    .i-spark {
      position:absolute; left:50%; top:42%; width:5px; height:5px; border-radius:50%;
      background:var(--paper); box-shadow:0 0 18px 4px color-mix(in srgb, var(--accent-2) 70%, transparent);
      transform:translate(-50%,-50%) scale(0); transition:transform 1.4s var(--ease);
      z-index:3;
    }
    .i-rift {
      position:absolute; left:50%; top:42%; width:1px; height:0;
      background:linear-gradient(to bottom, transparent, var(--accent-2) 18%, var(--paper) 50%, var(--accent-2) 82%, transparent);
      box-shadow:0 0 26px 2px color-mix(in srgb, var(--accent-2) 55%, transparent);
      transform:translate(-50%,-50%); transition:height 1.6s var(--ease); z-index:2;
    }
    .i-ring { position:absolute; left:50%; top:42%; border-radius:50%; border:1px solid var(--accent-2);
      transform:translate(-50%,-50%) scale(1.7); opacity:0; transition:transform 2.1s var(--ease), opacity 2.1s var(--ease); z-index:1; }
    .i-ring--outer { width:38vmin; height:38vmin; }
    .i-ring--inner { width:22vmin; height:22vmin; border-style:dashed; transition-delay:.15s; }

    .i-spokes { position:absolute; left:50%; top:42%; width:52vmin; height:52vmin; transform:translate(-50%,-50%) rotate(0deg);
      opacity:0; transition:opacity 1.8s ease, transform 6s linear; z-index:1; }
    .i-spokes::before {
      content:""; position:absolute; inset:0; border-radius:50%;
      background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--accent-2) 30%, transparent) 0deg 0.6deg, transparent 0.6deg 30deg);
      mask:radial-gradient(circle, transparent 62%, #000 63%, #000 64%, transparent 65%);
    }

    .i-copy { position:relative; z-index:4; opacity:0; transform:translateY(18px); transition:opacity 1.1s var(--ease), transform 1.1s var(--ease); transition-delay:.15s; }
    .i-eyebrow { color:var(--accent-2); text-transform:uppercase; letter-spacing:.26em; font-size:11px; font-weight:700; margin:0 0 28px; }
    .i-title {
      font-family:"Palatino Linotype", Palatino, Georgia, serif; font-weight:400;
      font-size:clamp(58px,11vw,150px); line-height:.86; margin:0; color:var(--text);
      letter-spacing:.5em; opacity:0; filter:blur(6px);
      transition: letter-spacing 1.6s var(--ease), opacity 1.6s var(--ease), filter 1.6s var(--ease);
    }
    .i-sub { font:italic 18px/1.6 Georgia,serif; color:#b8b0a2; max-width:44ch; margin:26px auto 0; opacity:0; transition:opacity 1s ease; transition-delay:.3s; }
    .i-enter { margin-top:52px; opacity:0; transition:opacity .8s ease; transition-delay:.5s; }
    .i-mark { width:1px; height:30px; margin:0 auto 18px; background:linear-gradient(to bottom,var(--accent-2),transparent); animation:driplike 2.6s ease-in-out infinite; }
    @keyframes driplike { 0%,100%{opacity:.3; transform:scaleY(.7);} 50%{opacity:1; transform:scaleY(1);} }

    .intro.st-spark .i-spark { transform:translate(-50%,-50%) scale(1); }
    .intro.st-rift .i-rift { height:46vh; }
    .intro.st-rings .i-ring { transform:translate(-50%,-50%) scale(1); opacity:1; }
    .intro.st-rings .i-spokes { opacity:1; }
    .intro.st-text .i-copy { opacity:1; transform:translateY(0); }
    .intro.st-text .i-title { letter-spacing:.01em; opacity:1; filter:blur(0); }
    .intro.st-text .i-sub { opacity:1; }
    .intro.st-text .i-enter { opacity:1; }

    .intro.is-leaving { opacity:0; transition:opacity .55s ease-out; pointer-events:none; }

    @media (prefers-reduced-motion: reduce) {
      .i-spark, .i-rift, .i-ring, .i-spokes, .i-copy, .i-title, .i-sub, .i-enter, .intro.is-leaving { transition-duration:.2s !important; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="intro" id="intro" role="button" tabindex="0" aria-label="Astranox betreten">
    <div class="i-spokes" aria-hidden="true"></div>
    <div class="i-ring i-ring--outer" aria-hidden="true"></div>
    <div class="i-ring i-ring--inner" aria-hidden="true"></div>
    <div class="i-rift" aria-hidden="true"></div>
    <div class="i-spark" aria-hidden="true"></div>

    <div class="i-copy">
      <p class="i-eyebrow">Ein Archiv aus einer fremden Zukunft</p>
      <h1 class="i-title">Astranox</h1>
      <p class="i-sub">Sechs Völker. Ein Reich, das keines von ihnen gebaut hat.</p>
      <div class="i-enter">
        <div class="i-mark" aria-hidden="true"></div>
        <a class="btn primary" id="introEnter" href="home.html">Eintreten</a>
      </div>
    </div>
  </main>

  <script src="js/audio-persist.js"></script>
  <script>
    var intro = document.getElementById('intro');
    var enterLink = document.getElementById('introEnter');

    function stage(cls, delay) { setTimeout(function () { intro.classList.add(cls); }, delay); }
    stage('st-spark', 250);
    stage('st-rings', 650);
    stage('st-rift', 900);
    stage('st-text', 1500);

    function enter(e) {
      if (e) e.preventDefault();
      if (intro.classList.contains('is-leaving')) return;
      intro.classList.add('is-leaving');
      setTimeout(function () { window.location.href = 'home.html'; }, 460);
    }
    enterLink.addEventListener('click', enter);
    intro.addEventListener('click', function (e) { if (e.target === intro) enter(e); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') enter(e);
    });

    if (window.AstranoxAudio.getEnabled()) {
      var themeAudio = new Audio('assets/audio/theme.mp3');
      themeAudio.loop = true;
      themeAudio.volume = window.AstranoxAudio.getVolume(0.55);
      window.AstranoxAudio.armAutoResume(function () {
        themeAudio.play().catch(function () {});
      });
    }
  </script>
</body>
</html>
