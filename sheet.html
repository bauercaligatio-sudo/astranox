<!doctype html>
<html lang="de" data-faction="nyxaren">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Charakterbogen — Astranox</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .sheet-wrap { width:min(900px, calc(100% - 48px)); margin:150px auto 100px; }
    .sheet-header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--accent); padding-bottom:18px; margin-bottom:36px; }
    .sheet-name { font:400 clamp(38px,5vw,60px)/.95 "Palatino Linotype",Palatino,Georgia,serif; }
    .sheet-meta { font:400 13px Georgia,serif; color:var(--muted); text-align:right; }
    .sheet-vital { display:flex; gap:40px; margin-bottom:30px; }
    .sheet-vital div { text-align:center; }
    .sheet-vital .val { font:400 34px "Palatino Linotype",Palatino,Georgia,serif; display:block; color:var(--accent-2); }
    .sheet-vital .lbl { text-transform:uppercase; letter-spacing:.14em; font-size:10px; color:var(--muted); }
    .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; }
    .sheet-block { border:1px solid var(--line); padding:24px; margin-bottom:24px; }
    .sheet-block h3 { text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--accent-2); margin:0 0 16px; font-weight:700; }
    .sheet-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .sheet-row:last-child { border-bottom:0; }
    .sheet-print { margin-top:16px; }
    @media (max-width:720px) { .sheet-grid { grid-template-columns:1fr; } }
    @media print {
      .grain, .scanlines, .site-header, .sheet-print, .sheet-back { display:none !important; }
      body { background:#fff; color:#111; }
      .sheet-name, .sheet-block h3 { color:#111; }
      .sheet-block, .sheet-header { border-color:#999; }
      .sheet-wrap { margin-top:0; }
      @page { margin:1.5cm; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="home.html#top" aria-label="Astranox Startseite">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>ASTRANOX</span>
    </a>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <a href="home.html#welt">Welt</a>
      <a href="home.html#voelker">Völker</a>
      <a href="home.html#zeitlinie">Zeitlinie</a>
      <a href="home.html#agenten">Agenten</a>
    </nav>
    <a class="sheet-back" href="home.html#agenten" style="justify-self:end; text-decoration:none; text-transform:uppercase; letter-spacing:.12em; font-size:10px; color:var(--muted);">← Neuer Agent</a>
  </header>

  <div class="sheet-wrap" id="sheetRoot">
    <p style="text-align:center; color:var(--muted);">Lade Charakterdaten …</p>
  </div>

  <script>
  (function () {
    var root = document.getElementById("sheetRoot");

    function renderCharacter(c) {
    if (c.faction) document.documentElement.dataset.faction = c.faction;

    var attrNames = { koerper:"Körper", geschick:"Geschick", verstand:"Verstand", wille:"Wille", praesenz:"Präsenz" };
    var skillNames = {
      nahkampf:"Nahkampf", athletik:"Athletik", widerstand:"Widerstand",
      fernkampf:"Fernkampf", heimlichkeit:"Heimlichkeit", fingerfertigkeit:"Fingerfertigkeit", pilotieren:"Pilotieren",
      wissen:"Wissen", technik:"Technik", medizin:"Medizin", wahrnehmung:"Wahrnehmung",
      disziplin:"Disziplin", okkultismus:"Okkultismus & Ritual",
      ueberzeugung:"Überzeugung", einschuechterung:"Einschüchterung", taeuschung:"Täuschung"
    };

    var attrHtml = Object.keys(attrNames).map(function (k) {
      return '<div class="sheet-row"><span>' + attrNames[k] + '</span><strong>' + c.attrs[k] + '</strong></div>';
    }).join("");

    var skillHtml = Object.keys(skillNames).map(function (k) {
      var v = c.skills[k] || 0;
      if (!v) return "";
      return '<div class="sheet-row"><span>' + skillNames[k] + '</span><strong>' + v + '</strong></div>';
    }).join("") || "<p style='color:var(--muted); font-size:13px;'>Keine Fertigkeitsränge vergeben.</p>";

    function block(title, rows) {
      if (!rows.length) return "";
      return '<div class="sheet-block"><h3>' + title + '</h3>' + rows.join("") + '</div>';
    }
    function row(label, value) {
      if (!value) return "";
      return '<div class="sheet-row"><span>' + label + '</span><strong>' + value + '</strong></div>';
    }
    function textBlock(title, text) {
      if (!text) return "";
      return '<div class="sheet-block"><h3>' + title + '</h3><p style="margin:0; color:#aaa397;">' + text + '</p></div>';
    }

    var eq = c.equipment || {};
    var origin = c.origin || {};
    var personality = c.personality || {};
    var appearance = c.appearance || {};

    var equipHtml = block("Ausrüstung", [
      row("Waffe", eq.weapon), row("Rüstung / Schutz", eq.armor),
      row("Gadget", eq.gadget), row("Persönlicher Gegenstand", eq.personalItem)
    ]);
    var originHtml = block("Herkunft &amp; Startsituation", [
      row("Rekrutierung", origin.hook), row("Rolle im Team", origin.teamRole), row("Herkunftsort", origin.birthplace)
    ]);
    var personalityHtml = block("Persönlichkeit", [
      row("Ideal", personality.ideal), row("Makel", personality.flaw)
    ]) + textBlock("Bindung ans Team", personality.bond);
    var appearanceHtml = block("Erscheinung", [
      row("Merkmal", appearance.trait)
    ]) + textBlock("Erscheinungsbild", appearance.description);

    root.innerHTML =
      '<div class="sheet-header">' +
        '<div><p class="eyebrow" style="margin-bottom:10px;">Agent des Dominat</p><h1 class="sheet-name">' + c.name + '</h1></div>' +
        '<div class="sheet-meta">' + c.volk + (c.subfaction ? ' · ' + c.subfaction : '') + (origin.teamRole ? '<br>' + origin.teamRole : '') + '</div>' +
      '</div>' +
      '<div class="sheet-vital">' +
        '<div><span class="val">' + c.lp + '</span><span class="lbl">LP</span></div>' +
        '<div><span class="val">' + c.gg + '</span><span class="lbl">GG</span></div>' +
      '</div>' +
      '<div class="sheet-grid">' +
        '<div class="sheet-block"><h3>Attribute</h3>' + attrHtml + '</div>' +
        '<div class="sheet-block"><h3>Fertigkeiten</h3>' + skillHtml + '</div>' +
      '</div>' +
      (c.ability ? '<div class="sheet-block"><h3>Besondere Fähigkeit</h3><p style="margin:0; color:#aaa397;">' + c.ability + '</p></div>' : '') +
      equipHtml + originHtml + personalityHtml + appearanceHtml +
      (c.background ? '<div class="sheet-block"><h3>Hintergrund</h3><p style="margin:0; color:#aaa397;">' + c.background + '</p></div>' : '') +
      '<div class="sheet-print" style="display:flex; gap:12px; flex-wrap:wrap;">' +
        '<button class="btn primary" id="printBtn" type="button">Charakterbogen drucken</button>' +
        '<button class="btn ghost" id="downloadBtn" type="button">Als Datei speichern (.json)</button>' +
        '<button class="btn ghost" id="loadBtn" type="button">Charakterdatei laden …</button>' +
      '</div>' +
      '<input type="file" id="loadInput" accept="application/json" hidden />';

    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("downloadBtn").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(c, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var safeName = (c.name || "agent").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      a.href = url;
      a.download = "astranox-" + (safeName || "agent") + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById("loadBtn").addEventListener("click", function () {
      document.getElementById("loadInput").click();
    });
    document.getElementById("loadInput").addEventListener("change", function (ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var loaded = JSON.parse(reader.result);
          try { localStorage.setItem("astranox:character", JSON.stringify(loaded)); } catch (e) {}
          renderCharacter(loaded);
        } catch (e) {
          alert("Diese Datei konnte nicht als Astranox-Charakter gelesen werden.");
        }
      };
      reader.readAsText(file);
    });
    }

    var raw = localStorage.getItem("astranox:character");
    if (!raw) {
      root.innerHTML = "<p style='text-align:center;'>Kein Charakter gefunden. <a href='home.html#agenten' style='color:var(--accent-2);'>Jetzt einen erstellen</a>, oder eine gespeicherte Datei laden:</p>" +
        "<div style='text-align:center;'><button class='btn ghost' id='loadBtnEmpty' type='button'>Charakterdatei laden …</button><input type='file' id='loadInputEmpty' accept='application/json' hidden /></div>";
      document.getElementById("loadBtnEmpty").addEventListener("click", function () { document.getElementById("loadInputEmpty").click(); });
      document.getElementById("loadInputEmpty").addEventListener("change", function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var loaded = JSON.parse(reader.result);
            try { localStorage.setItem("astranox:character", JSON.stringify(loaded)); } catch (e) {}
            renderCharacter(loaded);
          } catch (e) {
            alert("Diese Datei konnte nicht als Astranox-Charakter gelesen werden.");
          }
        };
        reader.readAsText(file);
      });
      return;
    }
    renderCharacter(JSON.parse(raw));
  })();
  </script>
</body>
</html>
